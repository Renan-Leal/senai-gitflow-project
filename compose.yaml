# Ponto de entrada do projeto. Cada serviço fica em config/<serviço>/compose.yaml.
# Todos os arquivos incluídos compartilham a rede padrão do projeto,
# então os serviços se enxergam pelo nome (api, db, prometheus, grafana).
include:
  - config/database/compose.yaml
  - config/app/compose.yaml
  - config/observability/compose.yaml
