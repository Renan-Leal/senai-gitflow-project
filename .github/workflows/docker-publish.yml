name: Docker Publish

# Workflow de publicação: quando há push na main (merge da develop),
# roda os testes e, se passarem, publica uma nova versão da imagem
# no Docker Hub, incrementando o patch da última tag (vX.Y.Z).
on:
  push:
    branches:
      - main

permissions:
  contents: write # necessário para criar e enviar a tag da versão

jobs:
  # 1) Reaproveita o workflow de testes (tests.yml)
  tests:
    uses: ./.github/workflows/tests.yml

  # 2) Calcula a próxima versão a partir da última tag do repositório
  version:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}

    steps:
      - name: Checkout repository (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: bump
        run: |
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
          fi
          VERSION=${LAST_TAG#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "Última versão: $LAST_TAG"
          echo "Nova versão:   v$NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

  # 3) Constrói e envia a imagem para o Docker Hub, depois cria a tag no Git
  publish:
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/senai-gitflow-project:${{ needs.version.outputs.new_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/senai-gitflow-project:latest

      - name: Create and push Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.version.outputs.new_version }}"
          git push origin "v${{ needs.version.outputs.new_version }}"
